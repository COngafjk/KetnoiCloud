<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch Sử Hệ Thống IoT</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .alert { background-color: #ffcccc !important; color: red; font-weight: bold; }
        .back-btn { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2196F3; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← Quay lại Bảng điều khiển</a>
        <h2>Lịch Sử Dữ Liệu Cảm Biến</h2>
        <table>
            <thead>
                <tr>
                    <th>Thời Gian (Việt Nam)</th>
                    <th>Nhiệt Độ (°C)</th>
                    <th>Độ Ẩm (%)</th>
                    <th>Khí Gas</th>
                    <th>Trạng Thái</th>
                </tr>
            </thead>
            <tbody id="logTable">
                <!-- Dữ liệu sẽ đổ vào đây -->
            </tbody>
        </table>
    </div>

    <script>
        async function loadHistory() {
            const response = await fetch('/history');
            const data = await response.json();
            const tableBody = document.getElementById('logTable');

            data.forEach(log => {
                const row = document.createElement('tr');
                if (log.canh_bao) row.classList.add('alert');

                // Chuyển đổi giờ sang giờ Việt Nam
                const time = new Date(log.thoi_gian).toLocaleString('vi-VN');

                row.innerHTML = `
                    <td>${time}</td>
                    <td>${log.nhiet_do}</td>
                    <td>${log.do_am}</td>
                    <td>${log.khi_gas}</td>
                    <td>${log.canh_bao ? 'NGUY HIỂM' : 'An toàn'}</td>
                `;
                tableBody.appendChild(row);
            });
        }
        loadHistory();
    </script>
</body>
</html>
